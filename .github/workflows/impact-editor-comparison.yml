name: Impact editor comparison (NO DELIVERY)
on:
  push:
    branches: [codex/impact-editor-ab-20261104]
    paths: [.github/workflows/impact-editor-comparison.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regression tests (no model calls)
        env:
          LLM_MODE: off
        run: python -m unittest discover -s tests -q
      - name: Capture once and compare twice (no delivery credentials)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN: '1'
          EDITOR_GATE: '1'
          LLM_MODE: live
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import json
          import os
          import subprocess
          import types
          from pathlib import Path
          from unittest.mock import patch
          from src import bot
          from src.processor import impact, reranker

          assert os.environ.get('GEMINI_API_KEY'), 'Missing model credential'
          assert bot.is_dry_run()
          assert not any(os.environ.get(k) for k in (
              'SLACK_WEBHOOK_URL', 'WEEKLY_SLACK_WEBHOOK_URL', 'TELEGRAM_BOT_TOKEN'))
          output = Path('comparison-output')
          output.mkdir()
          baseline_module = types.ModuleType('src.processor.impact_baseline')
          baseline_module.__package__ = 'src.processor'
          baseline_code = subprocess.check_output([
              'git', 'show', '49497e9290395443e7fc61b2624c92b29d6553c8:src/processor/impact.py'
          ], text=True, encoding='utf-8')
          exec(compile(baseline_code, '<pinned-baseline>', 'exec'), baseline_module.__dict__)
          class Captured(BaseException):
              pass

          captured = []
          def capture(articles):
              captured.extend(copy.deepcopy([
                  a for a in articles if impact.is_impact(a)
                  and a.get('editor_verdict') == 'keep' and not a.get('editorial_excluded')
              ]))
              raise Captured()

          def forbid_delivery(*args, **kwargs):
              raise RuntimeError('Delivery path is forbidden in this comparison')

          # Stop BEFORE translation, Slack formatting, delivery, archive and seen writes.
          with patch.object(impact, 'review', side_effect=capture), \
               patch.object(bot, 'send_aggregated_slack_news', side_effect=forbid_delivery):
              try:
                  bot.main()
              except Captured:
                  pass
          assert captured, 'No eligible impact candidates captured'
          captured.sort(key=lambda a: str(a.get('title_orig') or a.get('title') or '').casefold())
          modules = {'before': baseline_module, 'after': impact}
          cards_by_variant = {name: module._cards(captured) for name, module in modules.items()}
          assert [c['title'] for c in cards_by_variant['before']] == [c['title'] for c in cards_by_variant['after']]
          digests = {}
          for name, cards in cards_by_variant.items():
              serialized = json.dumps(cards, ensure_ascii=False, sort_keys=True)
              digests[name] = hashlib.sha256(serialized.encode()).hexdigest()
              (output / (name + '-cards.json')).write_text(serialized, encoding='utf-8')
          prompts = {name: module._prompt(cards_by_variant[name]) for name, module in modules.items()}
          assert all(len(p) <= impact.IMPACT_DAILY_CONFIG['max_input_chars'] for p in prompts.values())
          for name, prompt in prompts.items():
              (output / (name + '-prompt.txt')).write_text(prompt, encoding='utf-8')
          # Pin the model already used by the gate; never compare different fallback models.
          model = reranker._RESOLVED_MODEL
          assert model, 'No resolved gate model; comparison aborted'
          results = []
          for sequence, variant in enumerate(('before', 'after', 'after', 'before'), 1):
              result = {'variant': variant, 'model': model, 'input_sha256': digests[variant]}
              try:
                  raw = reranker._post_generate(model, os.environ['GEMINI_API_KEY'], prompts[variant],
                                               timeout=impact.IMPACT_DAILY_CONFIG['timeout'])
                  (output / f'{sequence}-{variant}.json').write_text(raw, encoding='utf-8')
                  selected, omitted = modules[variant]._validate(raw, cards_by_variant[variant])
                  result.update(valid=True, selected=selected, omitted=omitted)
              except Exception as exc:
                  result.update(valid=False, error_type=type(exc).__name__)
              results.append(result)
              print(f'Comparison {sequence}: {variant}, valid={result["valid"]}')
              (output / 'partial-results.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          report = {'note': 'Fresh capture, NOT an exact replay of the morning run.',
                    'candidate_count': len(captured), 'results': results}
          (output / 'comparison.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Comparison complete; no delivery or persistent state update.')
          assert all(r['valid'] for r in results), 'One or more model responses invalid; inspect artifacts'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impact-comparison-${{ github.run_id }}
          path: comparison-output/
          retention-days: 3
          if-no-files-found: warn
