name: News Bot 📰

on:
  # 실제 뉴스 발송은 수동 실행만 허용한다.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "미리보기만 (슬랙 발송·seen 저장 없음)"
        type: boolean
        default: false
      editor_gate:
        # 기본 켜짐. cron-job.org 처럼 입력 없이 부르는 호출도 이 값을 쓴다.
        # 게이트가 실패하면 코드가 알아서 기존 키워드 경로로 폴백하므로,
        # 되돌리려면 이 default 를 false 로 내리면 된다.
        description: "LLM 편집 게이트 사용"
        type: boolean
        default: true
      as_of_date:
        description: "과거 날짜 재현 (YYYY-MM-DD, 비우면 오늘). Google News 만 완전 재현됨"
        type: string
        default: ""
  # PR에서는 발송 없이 편집 정책 테스트만 자동 실행한다.
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/run.yml"

jobs:
  test-editorial-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test editorial policy
        run: python -m unittest discover -s tests -v

  run-bot:
    needs: test-editorial-policy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    concurrency:
      group: daily-news-bot-state
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Restore semantic duplicate state
        uses: actions/cache@v4
        with:
          path: data/seen_embeddings.npz
          key: news-semantic-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            news-semantic-${{ runner.os }}-

      - name: Validate required configuration
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN_REQUESTED: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          failed=0

          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::error::GEMINI_API_KEY가 없습니다. 뉴스 품질 선별을 실행할 수 없습니다."
            failed=1
          fi

          if [[ "$DRY_RUN_REQUESTED" != "true" && -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::error::SLACK_WEBHOOK_URL이 없습니다. 실제 뉴스 발송을 할 수 없습니다."
            failed=1
          fi

          if [[ -z "$GMAIL_USER" && -z "$GMAIL_APP_PASSWORD" ]]; then
            echo "::warning::Gmail 뉴스레터 연결이 없어 RSS 기사만 수집합니다."
          elif [[ -z "$GMAIL_USER" || -z "$GMAIL_APP_PASSWORD" ]]; then
            echo "::error::Gmail 주소와 앱 비밀번호 중 하나만 설정되어 있습니다."
            failed=1
          fi

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          EDITOR_GATE: ${{ inputs.editor_gate && '1' || '' }}
          AS_OF_DATE: ${{ inputs.as_of_date }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m src.bot

      # 판정 로그는 평가셋을 실제 파이프라인과 같은 입력으로 다시 만들 때 쓴다.
      # 레포에 커밋하면 계속 자라므로 실행 아티팩트로만 남긴다.
      - name: Upload decision log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decisions-${{ github.run_id }}
          path: data/last_run_decisions.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit seen files and slack archive
        if: ${{ !inputs.dry_run }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          state_files=(
            data/seen_news.txt
            data/seen_titles.txt
            data/slack_archive.jsonl
          )
          for state_file in "${state_files[@]}"; do
            if [[ -f "$state_file" ]]; then
              git add -- "$state_file"
            fi
          done

          if git diff --staged --quiet; then
            echo "No news state changes to save."
          else
            git commit -m "Update seen files and slack archive [skip ci]"
            git push
          fi
