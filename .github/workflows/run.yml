name: News Bot 📰

on:
  # 실제 뉴스 발송은 수동 실행만 허용한다.
  workflow_dispatch:
  # PR에서는 발송 없이 편집 정책 테스트만 자동 실행한다.
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/run.yml"

jobs:
  test-editorial-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test editorial policy
        run: python -m unittest discover -s tests -v

  run-bot:
    needs: test-editorial-policy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: daily-news-bot-state
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Restore semantic duplicate state
        uses: actions/cache@v4
        with:
          path: data/seen_embeddings.npz
          key: news-semantic-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            news-semantic-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.bot

      - name: Commit seen files and slack archive
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          state_files=(
            data/seen_news.txt
            data/seen_titles.txt
            data/slack_archive.jsonl
          )
          for state_file in "${state_files[@]}"; do
            if [[ -f "$state_file" ]]; then
              git add -- "$state_file"
            fi
          done

          if git diff --staged --quiet; then
            echo "No news state changes to save."
          else
            git commit -m "Update seen files and slack archive [skip ci]"
            git push
          fi
