name: Delete requested weekly test message
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delete-exact-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Delete only the user-requested bot test message
        env:
          SLACK_BOT_TOKEN_NEXT: ${{ secrets.SLACK_BOT_TOKEN_NEXT }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ['SLACK_BOT_TOKEN_NEXT']
          def call(method, payload):
              request = urllib.request.Request('https://slack.com/api/' + method,
                  data=json.dumps(payload).encode(), headers={
                      'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)
          try:
              identity = call('auth.test', {})
              if identity.get('ok') is not True or identity.get('team_id') != 'T0908FGHH' or identity.get('user_id') != 'U0CH3UYEURX':
                  raise ValueError('identity mismatch')
              result = call('chat.delete', {'channel':'C62PHQ9MY', 'ts':'1794539452.310549'})
              if result.get('ok') is not True:
                  raise ValueError('delete not confirmed')
              print('Deleted requested message: C62PHQ9MY / 1794539452.310549')
          except Exception:
              print('Deletion not confirmed. No automatic retry; inspect exact message.')
              raise SystemExit(1)
          PY
