name: Weekly VC Briefing 📊
run-name: "Weekly briefing — ${{ inputs.delivery_target || 'preview' }}"

on:
  # cron-job.org가 Asia/Seoul 기준 월요일 08:30에 workflow_dispatch로 호출한다.
  # 외부 호출은 delivery_target=production, force_send=false를 명시한다.
  # end_date는 생략해 직전 일요일까지를 집계하고, 수동 실행 기본값은 preview로 둔다.
  workflow_dispatch:
    inputs:
      delivery_target:
        description: "market_check=시장지표만 점검, preview=미리보기, test=일간 채널, production=주간 채널"
        type: choice
        options:
          - preview
          - market_check
          - test
          - production
        default: preview
      end_date:
        description: "재현할 주의 일요일 (YYYY-MM-DD, 비우면 지난 일요일)"
        type: string
        default: ""
      force_send:
        description: "이미 발송한 주차도 다시 발송"
        type: boolean
        default: false

jobs:
  weekly-briefing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    # 일간 실행의 아카이브 커밋과 주간 기록 커밋이 충돌하지 않게 직렬화한다.
    concurrency:
      group: daily-news-bot-state
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate weekly configuration
        env:
          SLACK_BOT_TOKEN: ${{ vars.SLACK_DELIVERY_VERSION == 'v2' && secrets.SLACK_BOT_TOKEN_NEXT || '' }}
          SLACK_DELIVERY_VERSION: ${{ vars.SLACK_DELIVERY_VERSION }}
          TARGET_CHANNEL_ID: ${{ inputs.delivery_target == 'test' && vars.SLACK_CHANNEL_ID || vars.WEEKLY_SLACK_CHANNEL_ID }}
          WEEKLY_SLACK_WEBHOOK_URL: ${{ secrets.WEEKLY_SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DELIVERY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_target || 'production' }}
        run: |
          if [[ "$SLACK_DELIVERY_VERSION" == "v2" && ( "$DELIVERY_TARGET" == "test" || "$DELIVERY_TARGET" == "production" ) ]]; then
            if [[ -z "$SLACK_BOT_TOKEN" || -z "$TARGET_CHANNEL_ID" ]]; then
              echo "::error::New Slack bot token or target channel is missing."
              exit 1
            fi
          elif [[ "$DELIVERY_TARGET" == "test" && -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::error::SLACK_WEBHOOK_URL is missing for test delivery."
            exit 1
          elif [[ "$DELIVERY_TARGET" == "production" && -z "$WEEKLY_SLACK_WEBHOOK_URL" ]]; then
            echo "::error::WEEKLY_SLACK_WEBHOOK_URL is missing for production delivery."
            exit 1
          fi
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::warning::GEMINI_API_KEY가 없어 3줄 요약과 영문 제목은 안전한 원문 대체 경로를 사용합니다."
          fi
          if [[ -z "$ECOS_API_KEY" || "$ECOS_API_KEY" == "sample" ]]; then
            echo "::warning::ECOS_API_KEY 설정이 필요합니다. KOSPI·KOSDAQ·USD/KRW는 수집 지연으로 표시되며 다른 제공처로 대체하지 않습니다."
          fi

      - name: Test editorial policy
        env:
          PYTHONIOENCODING: "utf-8"
        run: python -m unittest discover -s tests -q

      - name: Run weekly briefing
        id: briefing
        env:
          SLACK_BOT_TOKEN: ${{ vars.SLACK_DELIVERY_VERSION == 'v2' && secrets.SLACK_BOT_TOKEN_NEXT || '' }}
          SLACK_DELIVERY_VERSION: ${{ vars.SLACK_DELIVERY_VERSION }}
          WEEKLY_SLACK_CHANNEL_ID: ${{ inputs.delivery_target == 'test' && vars.SLACK_CHANNEL_ID || vars.WEEKLY_SLACK_CHANNEL_ID }}
          WEEKLY_SLACK_WEBHOOK_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_target == 'test' && secrets.SLACK_WEBHOOK_URL || secrets.WEEKLY_SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EDITORIAL_REVIEW_SHEET_URL: ${{ vars.EDITORIAL_REVIEW_SHEET_URL }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.delivery_target == 'preview' || inputs.delivery_target == 'market_check') && '1' || '' }}
          DELIVERY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_target || 'production' }}
          WEEKLY_END_DATE: ${{ inputs.end_date || '' }}
          WEEKLY_FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send && '1' || '' }}
          WEEKLY_ARCHIVE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_target == 'test' && '/tmp/weekly_archive.jsonl' || '' }}
          PYTHONUNBUFFERED: "1"
          QUALITY_MONITORING: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          if [[ "$DELIVERY_TARGET" == "market_check" ]]; then
            args=()
            if [[ -n "$WEEKLY_END_DATE" ]]; then
              args+=(--end-date "$WEEKLY_END_DATE")
            fi
            python -m src.weekly.check_markets "${args[@]}"
          else
            python -m src.weekly.runner
          fi

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/quality_last_run.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit weekly archive and editorial review
        if: ${{ always() && (steps.briefing.outcome == 'success' || steps.briefing.outcome == 'failure') && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.delivery_target == 'production')) }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          state_files=(
            data/weekly_archive.jsonl
            data/weekly_archive_recovery.jsonl
            data/weekly_review.csv
          )
          for state_file in "${state_files[@]}"; do
            if [[ -f "$state_file" ]]; then
              git add -- "$state_file"
            fi
          done
          if git diff --staged --quiet; then
            echo "No weekly state changes to save."
          else
            git commit -m "Update weekly briefing archive [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      - name: Preserve weekly delivery recovery snapshot
        if: ${{ always() && (steps.briefing.outcome == 'success' || steps.briefing.outcome == 'failure') && inputs.delivery_target == 'production' }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-delivery-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/weekly_archive*.jsonl
          retention-days: 7
          if-no-files-found: warn
